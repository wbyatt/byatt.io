<!DOCTYPE html>

<body>

<div class="accent-bar"></div>

<div class="page">

      </div>
      <div class="header-body">

      </div>
      <div class="header-margin">

          <div class="status-pip active"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="ornament-band">

  
  <svg class="band-dark-svg" viewBox="0 0 1140 44" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="interlace-dark" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
        <rect width="44" height="44" fill="#0b0f0e"/>
        <rect x="1" y="1" width="42" height="42" fill="none" stroke="#2d5040" stroke-width="0.8"/>
        <line x1="1" y1="1" x2="43" y2="43" stroke="#1e3328" stroke-width="0.7"/>
        <line x1="43" y1="1" x2="1" y2="43" stroke="#1e3328" stroke-width="0.7"/>
        <polygon points="22,3 41,22 22,41 3,22" fill="none" stroke="#2d5040" stroke-width="0.8"/>
        <line x1="22" y1="1" x2="22" y2="43" stroke="#3d6e52" stroke-width="0.5" opacity="0.5"/>
        <line x1="1" y1="22" x2="43" y2="22" stroke="#3d6e52" stroke-width="0.5" opacity="0.5"/>
        <circle cx="22" cy="22" r="3.5" fill="none" stroke="#3d6e52" stroke-width="0.8"/>
        <circle cx="22" cy="22" r="1.2" fill="#7ec8a0" opacity="0.6"/>
        <rect x="1" y="1" width="6" height="6" fill="#1e3328" stroke="#2d5040" stroke-width="0.5"/>
        <rect x="37" y="1" width="6" height="6" fill="#1e3328" stroke="#2d5040" stroke-width="0.5"/>
        <rect x="1" y="37" width="6" height="6" fill="#1e3328" stroke="#2d5040" stroke-width="0.5"/>
        <rect x="37" y="37" width="6" height="6" fill="#1e3328" stroke="#2d5040" stroke-width="0.5"/>
        <circle cx="4" cy="4" r="1.5" fill="#8a7040" opacity="0.7"/>
        <circle cx="40" cy="4" r="1.5" fill="#8a7040" opacity="0.7"/>
        <circle cx="4" cy="40" r="1.5" fill="#8a7040" opacity="0.7"/>
        <circle cx="40" cy="40" r="1.5" fill="#8a7040" opacity="0.7"/>
      </pattern>
    </defs>
    <rect width="1140" height="44" fill="url(#interlace-dark)"/>
    <line x1="0" y1="0.5" x2="1140" y2="0.5" stroke="#7a4e18" stroke-width="1"/>
    <line x1="0" y1="43.5" x2="1140" y2="43.5" stroke="#7a4e18" stroke-width="1"/>
    <line x1="0" y1="22" x2="1140" y2="22" stroke="#d4913a" stroke-width="0.5" opacity="0.4"/>
  </svg>

  
  <div class="band-light-rules">
    <div class="rule-thin"></div>
    <div class="rule-ornament-row">
      <div class="rule-fleuron">
        <svg viewBox="0 0 48 14" xmlns="http://www.w3.org/2000/svg">
          <polygon points="7,1 13,7 7,13 1,7" fill="none" stroke="#b0a898" stroke-width="1"/>
          <circle cx="7" cy="7" r="1.5" fill="#7a6030" opacity="0.6"/>

          <line x1="18.5" y1="7" x2="29.5" y2="7" stroke="#c0b8aa" stroke-width="0.7"/>
          <circle cx="24" cy="7" r="1.8" fill="#b53422" opacity="0.7"/>
          <polygon points="41,1 47,7 41,13 35,7" fill="none" stroke="#b0a898" stroke-width="1"/>
          <circle cx="41" cy="7" r="1.5" fill="#7a6030" opacity="0.6"/>
          <line x1="13" y1="7" x2="18.5" y2="7" stroke="#c0b8aa" stroke-width="0.7"/>
          <line x1="29.5" y1="7" x2="35" y2="7" stroke="#c0b8aa" stroke-width="0.7"/>
        </svg>
      </div>
    </div>
    <div class="rule-thick"></div>
  </div>

</div>


  <div class="doc-footer" style="border-top: none;">
    <div class="footer-gutter"></div>
    <div class="footer-body" style="display: block; padding: 24px;">
      <div class="treatise-list">
        
      </div>
    </div>
    <div class="footer-margin"></div>
  </div>
</div>



<script>

(function() {
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');

  function giscusThemeUrl(theme) {
    return theme === 'light'
      ? '/css/giscus-illuminated-light.css'
      : '/css/giscus-illuminated.css';
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('byatt-theme', theme);
    
    var giscusFrame = document.querySelector('iframe.giscus-frame');
    if (giscusFrame) {
      giscusFrame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusThemeUrl(theme) } } },
        'https://giscus.app'
      );
    }
  }

  var saved = localStorage.getItem('byatt-theme') || 'dark';
  applyTheme(saved);

  if (toggle) {
    toggle.addEventListener('click', function() {
      var current = root.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  }
})();


(function() {
  var sections = document.querySelectorAll('.section-head-row[data-section]');
  var navSection = document.getElementById('navSection');
  var navLabel = document.getElementById('navLabel');
  var navPip = document.querySelector('.mobile-nav-pip');
  if (!navSection || !navLabel || sections.length === 0) return;

  var current = -1;
  var ticking = false;

  function update() {
    var scrollY = window.scrollY + 60;
    var active = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top + window.scrollY <= scrollY) {
        active = i;
      }
    }
    if (active !== current) {
      current = active;
      var s = sections[active];
      navSection.textContent = s.getAttribute('data-section');
      navLabel.textContent = s.getAttribute('data-label');
      if (navPip) {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        navPip.style.background = 'var(--amber)';
        navPip.style.boxShadow = isLight ? 'none' : '0 0 8px rgba(212,145,58,0.8)';
        setTimeout(function() {
          navPip.style.background = isLight ? 'var(--rule-hi)' : 'var(--phosphor-dim)';
          navPip.style.boxShadow = isLight ? 'none' : '0 0 4px rgba(126,200,160,0.3)';
        }, 400);
      }
    }
    ticking = false;
  }

  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
  update();
})();
</script>
</body>
</html>
