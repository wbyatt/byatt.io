  var theme = localStorage.getItem('byatt-theme') || 'light';
  var themeUrl = theme === 'light'
    ? 'https://byatt.io/css/giscus-iki-light.css'
    : 'https://byatt.io/css/giscus-iki.css';
  var s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';

  s.setAttribute('data-input-position', 'top');
  s.setAttribute('data-theme', themeUrl);

  s.setAttribute('data-loading', 'lazy');
  s.setAttribute('crossorigin', 'anonymous');
  s.async = true;
  container.appendChild(s);
})();
</script>



<script>
(function() {
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');

  function giscusThemeUrl(theme) {
    return theme === 'light'
      ? 'https://byatt.io/css/giscus-iki-light.css'
      : 'https://byatt.io/css/giscus-iki.css';
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('byatt-theme', theme);
    var giscusFrame = document.querySelector('iframe.giscus-frame');
    if (giscusFrame) {
      giscusFrame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusThemeUrl(theme) } } },
        'https://giscus.app'
      );
    }
  }

  var saved = localStorage.getItem('byatt-theme') || 'light';
  applyTheme(saved);

  if (toggle) {
    toggle.addEventListener('click', function() {
      var current = root.getAttribute('data-theme') || 'light';
      applyTheme(current === 'light' ? 'dark' : 'light');
    });
  }
})();
</script>
