<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="760" height="360" fill="#FCFBF7"/>
  <rect x="1" y="1" width="758" height="358" fill="none" stroke="#E8E2D1" stroke-width="2"/>

  <text x="170" y="30" font-size="13" font-style="italic" fill="#6B665C">sensor reading (error rate) over time</text>

  <!-- legend -->
  <rect x="520" y="20" width="14" height="11" fill="#4A5240"/>
  <text x="540" y="30" font-size="13" fill="#1C1B18">healthy</text>
  <rect x="620" y="20" width="14" height="11" fill="#6E2A1E"/>
  <text x="640" y="30" font-size="13" fill="#1C1B18">unhealthy</text>

  <!-- dead band -->
  <rect x="170" y="110" width="560" height="40" fill="#E8E2D1" opacity="0.75"/>
  <text x="722" y="135" text-anchor="end" font-size="12" font-style="italic" fill="#6B665C">dead band</text>

  <!-- thresholds -->
  <line x1="170" y1="110" x2="730" y2="110" stroke="#6E2A1E" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="174" y="103" font-size="12" fill="#6E2A1E">trip threshold</text>
  <line x1="170" y1="150" x2="730" y2="150" stroke="#4A5240" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="174" y="166" font-size="12" fill="#4A5240">clear threshold</text>

  <!-- metric -->
  <polyline points="170,200 200,190 220,205 240,185 260,195 280,170 300,180 320,160 340,172 360,148 380,158 400,140 420,152 440,128 460,142 480,118 500,132 520,108 540,122 560,100 580,115 600,95 620,108 640,88 660,100 680,82 700,95 710,78 730,85" fill="none" stroke="#1C1B18" stroke-width="2"/>

  <!-- baseline -->
  <line x1="170" y1="222" x2="730" y2="222" stroke="#6B665C" stroke-width="1"/>

  <!-- single-threshold state strip -->
  <text x="160" y="263" text-anchor="end" font-size="13" fill="#3A3833">single threshold</text>
  <rect x="170" y="250" width="346" height="18" fill="#4A5240"/>
  <rect x="516" y="250" width="10" height="18" fill="#6E2A1E"/>
  <rect x="526" y="250" width="23" height="18" fill="#4A5240"/>
  <rect x="549" y="250" width="25" height="18" fill="#6E2A1E"/>
  <rect x="574" y="250" width="10" height="18" fill="#4A5240"/>
  <rect x="584" y="250" width="146" height="18" fill="#6E2A1E"/>
  <text x="545" y="244" font-size="12" font-style="italic" fill="#6E2A1E">flapping</text>

  <!-- hysteresis state strip -->
  <text x="160" y="295" text-anchor="end" font-size="13" fill="#3A3833">with dead band</text>
  <rect x="170" y="282" width="346" height="18" fill="#4A5240"/>
  <rect x="516" y="282" width="214" height="18" fill="#6E2A1E"/>
  <text x="524" y="316" font-size="12" font-style="italic" fill="#6B665C">one transition, held by memory</text>
</svg>
