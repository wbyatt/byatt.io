<!-- ══ RESPONSA — communal discussion space, below the document ══ -->
<div class="responsa">
  <div class="responsa-header">
    <span class="responsa-label">Responsa</span>
  </div>
  <div class="responsa-body" id="responsa-body"
       data-repo="wbyatt/byatt.io"
       data-repo-id="R_kgDOMvtUZA"
       data-category="Comments"
       data-category-id="DIC_kwDOMvtUZM4C56QU"
       data-term="{{ .Params.doc_id | default .RelPermalink }}">
    <!-- Giscus script injected by JS to set correct initial theme -->
  </div>
</div>
<script>
(function() {
  var container = document.getElementById('responsa-body');
  if (!container) return;
  var theme = localStorage.getItem('byatt-theme') || 'dark';
  var themeUrl = theme === 'light'
    ? '/css/giscus-illuminated-light.css'
    : '/css/giscus-illuminated.css';
  var s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.setAttribute('data-repo', container.getAttribute('data-repo'));
  s.setAttribute('data-repo-id', container.getAttribute('data-repo-id'));
  s.setAttribute('data-category', container.getAttribute('data-category'));
  s.setAttribute('data-category-id', container.getAttribute('data-category-id'));
  s.setAttribute('data-mapping', 'specific');
  s.setAttribute('data-term', container.getAttribute('data-term'));
  s.setAttribute('data-strict', '0');
  s.setAttribute('data-reactions-enabled', '1');
  s.setAttribute('data-emit-metadata', '0');
  s.setAttribute('data-input-position', 'top');
  s.setAttribute('data-theme', themeUrl);
  s.setAttribute('data-lang', 'en');
  s.setAttribute('data-loading', 'lazy');
  s.setAttribute('crossorigin', 'anonymous');
  s.async = true;
  container.appendChild(s);
})();
</script>
