<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}{{ with .Site.Title }} — {{ . }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/illuminated.css" | relURL }}">
</head>
<body>

<!-- Theme toggle — fixed bottom-right, persistent via localStorage -->
<button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle theme">
  <div class="theme-toggle-icon"></div>
</button>

<!-- Mobile sticky running header — hidden on desktop via CSS -->
<nav class="mobile-nav" aria-label="Document position">
  <a href="/" class="mobile-nav-sigil">{{ .Site.Title }}</a>
  <span class="mobile-nav-location">
    <span class="nav-section" id="navSection"></span>
    <span id="navLabel"></span>
  </span>
  <div class="mobile-nav-pip"></div>
</nav>

{{ block "main" . }}{{ end }}

<!-- Theme system + scroll tracker -->
<script>
// Theme toggle with localStorage persistence
(function() {
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('byatt-theme', theme);
  }

  var saved = localStorage.getItem('byatt-theme') || 'dark';
  applyTheme(saved);

  if (toggle) {
    toggle.addEventListener('click', function() {
      var current = root.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  }
})();

// Mobile scroll tracker
(function() {
  var sections = document.querySelectorAll('.section-head-row[data-section]');
  var navSection = document.getElementById('navSection');
  var navLabel = document.getElementById('navLabel');
  var navPip = document.querySelector('.mobile-nav-pip');
  if (!navSection || !navLabel || sections.length === 0) return;

  var current = -1;
  var ticking = false;

  function update() {
    var scrollY = window.scrollY + 60;
    var active = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top + window.scrollY <= scrollY) {
        active = i;
      }
    }
    if (active !== current) {
      current = active;
      var s = sections[active];
      navSection.textContent = s.getAttribute('data-section');
      navLabel.textContent = s.getAttribute('data-label');
      if (navPip) {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        navPip.style.background = 'var(--amber)';
        navPip.style.boxShadow = isLight ? 'none' : '0 0 8px rgba(212,145,58,0.8)';
        setTimeout(function() {
          navPip.style.background = isLight ? 'var(--rule-hi)' : 'var(--phosphor-dim)';
          navPip.style.boxShadow = isLight ? 'none' : '0 0 4px rgba(126,200,160,0.3)';
        }, 400);
      }
    }
    ticking = false;
  }

  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
  update();
})();
</script>
</body>
</html>
